name: Harvest ring status snapshot

# Static Data Covenant (kody-w/RAR CONSTITUTION.md Article XXIV): index.html
# reads data/commits/<repo>.json and data/canary-branches.json from this
# Pages origin instead of calling api.github.com from the visitor browser.
# This workflow keeps those snapshots fresh on a schedule (the ring repos
# move independently of this one, so a push trigger alone isn't enough).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harvest ring status
        run: python3 scripts/harvest_ring_status.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "rapp-train Pages Bot"
          git config user.email "rapp-train-pages-bot@users.noreply.github.com"
          git add data/commits data/canary-branches.json
          git diff --cached --quiet || git commit -m "chore: refresh ring status snapshot"
          git push
